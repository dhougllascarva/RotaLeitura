name: Atualizar JSONs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  converter:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Criar pasta entrada
        run: mkdir -p entrada

      - name: Baixar CSV
        run: |
          curl -L "https://drive.google.com/uc?export=download&id=1zYfqIrgmebYYHVog4k_xCq5aABMuLvm9" -o entrada/base.csv

      - name: Executar conversão
        run: node scripts/converter.js

      - name: Remover CSV
        run: rm -f entrada/base.csv

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add *.json indexes.json

          git commit -m "Atualização automática dos JSONs" || echo "Sem alterações"

          git push
