<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#031D44">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RotaLeitura">

  <title>RotaLeitura</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="launchericon-192x192.png">
  <link rel="apple-touch-icon" href="launchericon-192x192.png">

  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/app.css?v=2.0.0">

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script type="module" src="src/app.js?v=2.0.0"></script>
</head>
<body>
  <div id="loadingTela" class="loadingTela oculto" role="status" aria-live="polite">
    <div class="loader" aria-hidden="true"></div>
    <div id="loadingTexto" class="loadingTexto">Carregando…</div>
  </div>

  <div id="offlineAviso" class="statusOffline oculto" role="status">📡 Funcionando offline</div>

  <main id="loginTela">
    <header class="topo">
      <div class="logo">RotaLeitura</div>
      <div class="sub">Inteligência em campo</div>
    </header>

    <div class="container">
      <section class="card" aria-label="Acesso">
        <input type="email" id="email" placeholder="E-mail" autocomplete="username" inputmode="email">
        <input type="password" id="senha" placeholder="Senha" autocomplete="current-password">
        <button class="botao" id="btnLogin" type="button">ENTRAR</button>
      </section>
    </div>
  </main>

  <main id="appTela" class="oculto">
    <header class="topo">
      <div class="logo">RotaLeitura</div>
      <div class="sub">Inteligência em campo</div>
    </header>

    <nav class="abas" aria-label="Navegação principal">
      <button class="aba ativa" id="btnBusca" type="button">BUSCA</button>
      <button class="aba" id="btnMapa" type="button">MAPA</button>
    </nav>

    <section id="abaBusca" class="container">
      <select id="area" aria-label="Área"></select>
      <input list="listaMRUs" id="mru" placeholder="Digite ou selecione a MRU" autocomplete="off">
      <datalist id="listaMRUs"></datalist>
      <input type="search" id="busca" placeholder="Buscar instalação, medidor ou cliente" autocomplete="off">
      <div id="statusOfflineCard" class="card oculto"></div>
      <div id="resultados" aria-live="polite"></div>
    </section>

    <section id="abaMapa" class="container oculto">
      <select id="areaMapa" aria-label="Área do mapa"></select>
      <input list="listaMRUsMapa" id="mruMapa" placeholder="Digite ou selecione a MRU" autocomplete="off">
      <datalist id="listaMRUsMapa"></datalist>
      <button class="botao" id="btnExibirMapa" type="button">EXIBIR MAPA</button>
      <div id="mapaStatus" class="mapa-status" role="status" aria-live="polite"></div>
      <div id="map" aria-label="Mapa das instalações"></div>
    </section>

    <div class="container">
      <button class="botao logout" id="btnLogout" type="button">SAIR</button>
    </div>
  </main>
</body>
</html>
